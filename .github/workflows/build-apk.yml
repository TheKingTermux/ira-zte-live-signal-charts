name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version label for the APK build"
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version label used for the APK artifact"
        required: true
        type: string
      source_ref:
        description: "Branch to build; defaults to the triggering ref"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Generate Bot Token
        id: get_bug_bot_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ steps.get_bug_bot_token.outputs.token }}
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set build version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="manual-$RUN_NUMBER"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository Actions secrets to sign upgrade-compatible APKs."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          test -s "$RUNNER_TEMP/android-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Install icon generation dependency
        run: python -m pip install --upgrade pillow

      - name: Generate Android launcher icons from source artwork
        run: python scripts/generate_app_icons.py --platform android

      - name: Build signed release APK
        working-directory: android
        env:
          BUILD_VERSION: ${{ steps.version.outputs.value }}
          RUN_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease -PandroidVersionCode="$RUN_NUMBER" -PandroidVersionName="$BUILD_VERSION"

      - name: Rename APK
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/IRA_ZTE_Live_Signal_Charts-$BUILD_VERSION.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ steps.version.outputs.value }}
          path: dist/IRA_ZTE_Live_Signal_Charts-${{ steps.version.outputs.value }}.apk
          if-no-files-found: error
          retention-days: 14
