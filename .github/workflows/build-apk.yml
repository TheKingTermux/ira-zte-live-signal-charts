name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version label for the APK build"
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version label used for the APK artifact"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Generate Bot Token
        id: get_bug_bot_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ steps.get_bug_bot_token.outputs.token }}
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set build version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="manual-$RUN_NUMBER"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/IRA_ZTE_Live_Signal_Charts-$BUILD_VERSION.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ steps.version.outputs.value }}
          path: dist/IRA_ZTE_Live_Signal_Charts-${{ steps.version.outputs.value }}.apk
          if-no-files-found: error
          retention-days: 14
