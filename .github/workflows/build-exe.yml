name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version label for the build"
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version label used for the build artifact"
        required: true
        type: string
      source_ref:
        description: "Branch to build; defaults to the triggering ref"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Windows portable and installer
    runs-on: windows-latest
    steps:
      - name: Generate Bot Token
        id: get_bug_bot_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ steps.get_bug_bot_token.outputs.token }}
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set build version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $version = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "manual-$($env:RUN_NUMBER)"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywebview requests urllib3 pillow
      - name: Generate embedded Windows icon from source artwork
        run: python scripts/generate_app_icons.py --platform windows
      - name: Check Python syntax
        run: python -m py_compile router_app.py scripts/generate_app_icons.py
      - name: Build EXE
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --windowed
          --collect-all webview
          --icon build-assets/icons/IRA_ZTE_Live_Signal_Charts.ico
          --name IRA_ZTE_Live_Signal_Charts
          router_app.py
      - name: Name portable EXE
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $source = "dist/IRA_ZTE_Live_Signal_Charts.exe"
          $target = "dist/IRA_ZTE_Live_Signal_Charts-Portable-$($env:BUILD_VERSION).exe"
          if (!(Test-Path $source)) { throw "PyInstaller did not produce the expected EXE: $source" }
          Move-Item -LiteralPath $source -Destination $target
          Write-Host "Created $target"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler (ISCC.exe) was not found." }
          & $iscc "/DMyAppVersion=$($env:BUILD_VERSION)" "installer/IRA_ZTE_Live_Signal_Charts.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }
      - name: Upload Windows EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-${{ steps.version.outputs.value }}
          path: |
            dist/IRA_ZTE_Live_Signal_Charts-Portable-${{ steps.version.outputs.value }}.exe
            dist/IRA_ZTE_Live_Signal_Charts-Setup-${{ steps.version.outputs.value }}.exe
          if-no-files-found: error
          retention-days: 14
