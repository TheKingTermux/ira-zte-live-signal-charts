name: Release from /build command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  announce:
    if: >-
      contains(fromJSON('["/build beta","/build stable"]'), github.event.comment.body) &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.user.type != 'Bot' &&
      !endsWith(github.event.comment.user.login, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Announce build start
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const command = context.payload.comment.body.trim();
            const mode = command === '/build stable' ? 'rilis stabil' : 'rilis beta';
            await github.rest.issues.createComment({
              owner, repo, issue_number: context.issue.number,
              body: '⏳ **' + mode.charAt(0).toUpperCase() + mode.slice(1) + ' sedang dilakukan.** Bot sedang menyiapkan versi, membangun EXE dan APK, lalu menerbitkan release. Saya akan membalas lagi setelah proses selesai.'
            });

  prepare:
    if: github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      mode: ${{ steps.version.outputs.mode }}
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      notes: ${{ steps.version.outputs.notes }}
      source_ref: ${{ steps.version.outputs.source_ref }}
    steps:
      - name: Generate Bot Token
        id: get_bug_bot_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Determine release version
        id: version
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.get_bug_bot_token.outputs.token }}
          script: |
            const body = context.payload.comment.body.trim();
            const mode = body === '/build stable' ? 'stable' : body === '/build beta' ? 'beta' : '';
            if (!mode) {
              core.setFailed('Invalid command. Use exactly /build stable or /build beta.');
              return;
            }

            const { owner, repo } = context.repo;
            const sourceRef = mode === 'stable' ? 'main' : 'dev';
            const sourceBranch = await github.rest.repos.getBranch({ owner, repo, branch: sourceRef });
            const sourceSha = sourceBranch.data.commit.sha;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100
            });
            const parseVersion = (tag) => {
              const match = String(tag).match(/^v?(\d+)\.(\d+)(?:\.(\d+))?(?:[-.]?(?:dev|beta|rc)[.-]?(\d+)?)?$/i);
              if (!match) return null;
              return {
                major: Number(match[1]),
                minor: Number(match[2]),
                patch: Number(match[3] || 0),
                isPre: /(?:dev|beta|rc)/i.test(tag),
                preNumber: Number(match[4] || 0),
                tag: String(tag)
              };
            };
            const parsed = releases.map(r => ({ ...r, v: parseVersion(r.tag_name) })).filter(r => r.v);
            const compareBase = (a, b) => (a.major - b.major) || (a.minor - b.minor) || (a.patch - b.patch);
            const compare = (a, b) => compareBase(a, b) || (a.preNumber - b.preNumber);
            const stable = parsed.filter(r => !r.v.isPre).sort((a,b) => compare(b.v, a.v));
            const prereleases = parsed.filter(r => r.v.isPre).sort((a,b) => compare(b.v, a.v));
            const latestStable = stable[0]?.v || { major: 1, minor: 0, patch: 0, tag: '1.0' };
            const latestPre = prereleases[0]?.v || null;

            let tag;
            if (mode === 'beta') {
              let base;
              if (latestPre && compareBase(latestPre, latestStable) > 0) {
                base = { major: latestPre.major, minor: latestPre.minor };
              } else {
                base = { major: latestStable.major, minor: latestStable.minor + 1 };
              }
              const prefix = String(base.major) + '.' + String(base.minor) + '-dev.';
              const next = parsed
                .map(r => r.v.tag)
                .filter(t => t.startsWith(prefix))
                .map(t => Number(t.slice(prefix.length)))
                .filter(Number.isFinite)
                .reduce((max, n) => Math.max(max, n), 0) + 1;
              tag = prefix + next;
            } else {
              if (latestPre && compareBase(latestPre, latestStable) > 0) {
                tag = String(latestPre.major) + '.' + String(latestPre.minor);
              } else {
                tag = String(latestStable.major) + '.' + String(latestStable.minor + 1);
              }
            }

            if (releases.some(r => r.tag_name === tag)) {
              core.setFailed('Release tag already exists: ' + tag + '. Inspect releases before retrying.');
              return;
            }

            // Create an isolated, version-stamped source branch. Never mutate main/dev.
            const buildBranch = 'automation/build-' + tag.replace(/[^A-Za-z0-9._-]/g, '-') + '-' + context.runId;
            await github.rest.git.createRef({
              owner, repo, ref: 'refs/heads/' + buildBranch, sha: sourceSha
            });

            const stampFile = async (path, transform) => {
              const response = await github.rest.repos.getContent({
                owner, repo, path, ref: buildBranch
              });
              if (Array.isArray(response.data) || !response.data.content || !response.data.sha) {
                throw new Error('Unable to read source file for version stamping: ' + path);
              }
              const original = Buffer.from(response.data.content, 'base64').toString('utf8');
              const updated = transform(original);
              if (updated === original) {
                throw new Error('Version marker was not found or already matches in ' + path);
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch: buildBranch,
                message: 'chore: stamp build version ' + tag,
                sha: response.data.sha,
                content: Buffer.from(updated, 'utf8').toString('base64')
              });
            };

            await stampFile('router_app.py', source => {
              const updated = source.replace(
                /^APP_VERSION\s*=\s*["'][^"']*["']/m,
                'APP_VERSION = "' + tag + '"'
              );
              if (updated === source) throw new Error('APP_VERSION assignment not found in router_app.py');
              return updated;
            });

            await stampFile('android/app/build.gradle', source => {
              const updated = source.replace(
                /^\s*versionName\s+.*$/m,
                '        versionName "' + tag + '"'
              );
              if (updated === source) throw new Error('versionName assignment not found in android/app/build.gradle');
              return updated;
            });

            const title = 'v' + tag;
            const previousTag = releases[0]?.tag_name || '';
            let notes = 'Automated ' + mode + ' release for commit ' + context.sha.slice(0, 7) + '.\n\n';
            if (previousTag) {
              notes += 'Changes since ' + previousTag + '.\n\n';
              try {
                const generated = await github.rest.repos.generateReleaseNotes({
                  owner, repo, tag_name: tag, target_commitish: sourceRef, previous_tag_name: previousTag
                });
                if (generated.data.body) notes += generated.data.body;
              } catch (error) {
                notes += 'Compare changes: https://github.com/' + owner + '/' + repo + '/compare/' + previousTag + '...' + tag;
              }
            } else {
              notes += 'Automated build from the ' + sourceRef + ' branch.';
            }

            core.setOutput('mode', mode);
            core.setOutput('tag', tag);
            core.setOutput('title', title);
            core.setOutput('prerelease', mode === 'beta' ? 'true' : 'false');
            core.setOutput('notes', notes);
            core.setOutput('source_ref', buildBranch);

  build-exe:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/build-exe.yml
    with:
      version: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
    secrets: inherit
    permissions:
      contents: read

  build-apk:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/build-apk.yml
    with:
      version: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
    secrets: inherit
    permissions:
      contents: read

  publish:
    needs: [prepare, build-exe, build-apk]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Generate Bot Token
        id: get_bug_bot_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ steps.get_bug_bot_token.outputs.token }}
          ref: ${{ needs.prepare.outputs.source_ref }}
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: windows-exe-${{ needs.prepare.outputs.tag }}
          path: release-assets
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk-${{ needs.prepare.outputs.tag }}
          path: release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ steps.get_bug_bot_token.outputs.token }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.title }}
          body: ${{ needs.prepare.outputs.notes }}
          target_commitish: ${{ needs.prepare.outputs.source_ref }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          files: |
            release-assets/*.exe
            release-assets/*.apk
            router_app.py
          fail_on_unmatched_files: true
      - name: Reply with release link
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_TITLE: ${{ needs.prepare.outputs.title }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const title = process.env.RELEASE_TITLE;
            const url = 'https://github.com/' + owner + '/' + repo + '/releases/tag/' + encodeURIComponent(tag);
            await github.rest.issues.createComment({
              owner, repo, issue_number: context.issue.number,
              body: '✅ **Build sudah selesai!** Rilis ' + title + ' berhasil diterbitkan. Silakan lihat dan unduh hasilnya di [GitHub Releases](' + url + ').'
            });


  cleanup-build-branch:
    needs: [prepare, publish]
    if: needs.publish.result == 'success' && needs.prepare.outputs.source_ref != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Bot Token
        id: get_bug_bot_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Delete temporary build branch
        uses: actions/github-script@v7
        env:
          BUILD_BRANCH: ${{ needs.prepare.outputs.source_ref }}
        with:
          github-token: ${{ steps.get_bug_bot_token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const branch = process.env.BUILD_BRANCH;
            if (!branch.startsWith('automation/build-')) {
              throw new Error('Refusing to delete a branch outside automation/build-*: ' + branch);
            }
            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: 'heads/' + branch
            });
            core.info('Deleted temporary build branch: ' + branch);

  report-failure:
    if: >-
      always() &&
      github.event.comment.user.login == github.repository_owner &&
      contains(fromJSON('["/build beta","/build stable"]'), github.event.comment.body) &&
      (needs.prepare.result == 'failure' || needs.build-exe.result == 'failure' || needs.build-apk.result == 'failure' || needs.publish.result == 'failure')
    needs: [prepare, build-exe, build-apk, publish]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Reply that build failed
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({
              owner, repo, issue_number: context.issue.number,
              body: '❌ **Build gagal.** Rilis belum berhasil diterbitkan. Periksa log workflow GitHub Actions untuk melihat penyebabnya; setelah diperbaiki, perintah build dapat dicoba kembali.'
            });

  help:
    if: >-
      github.event.comment.body != '' &&
      github.event.comment.body == '/cmd' &&
      github.event.comment.user.type != 'Bot' &&
      !endsWith(github.event.comment.user.login, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Reply with release commands
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            const body = [
              '🤖 **Perintah Rilis IRA ZTE**',
              '',
              '- `/cmd` — menampilkan daftar perintah ini.',
              '- `/build beta` — membuat rilis beta dari branch `dev`.',
              '- `/build stable` — membuat rilis stabil dari branch `main`.',
              '',
              '**Catatan:** perintah build hanya dapat dijalankan oleh pemilik repositori. Kirim perintah sebagai komentar tersendiri.'
            ].join('\\n');
            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber, body
            });

