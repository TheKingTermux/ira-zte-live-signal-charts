name: Release from /build command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      mode: ${{ steps.version.outputs.mode }}
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      notes: ${{ steps.version.outputs.notes }}
      source_ref: ${{ steps.version.outputs.source_ref }}
    steps:
      - name: Generate Bot Token
        id: get_bug_bot_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Determine release version
        id: version
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.get_bug_bot_token.outputs.token }}
          script: |
            const body = context.payload.comment.body.trim();
            const mode = body === '/build stable' ? 'stable' : body === '/build beta' ? 'beta' : '';
            if (!mode) {
              core.setFailed('Invalid command. Use exactly /build stable or /build beta.');
              return;
            }

            const { owner, repo } = context.repo;
            const sourceRef = mode === 'stable' ? 'main' : 'dev';
            const sourceBranch = await github.rest.repos.getBranch({ owner, repo, branch: sourceRef });
            const sourceSha = sourceBranch.data.commit.sha;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100
            });
            const parseVersion = (tag) => {
              const match = String(tag).match(/^v?(\d+)\.(\d+)(?:\.(\d+))?(?:[-.]?(?:dev|beta|rc)[.-]?(\d+)?)?$/i);
              if (!match) return null;
              return {
                major: Number(match[1]),
                minor: Number(match[2]),
                patch: Number(match[3] || 0),
                isPre: /(?:dev|beta|rc)/i.test(tag),
                preNumber: Number(match[4] || 0),
                tag: String(tag)
              };
            };
            const parsed = releases.map(r => ({ ...r, v: parseVersion(r.tag_name) })).filter(r => r.v);
            const compareBase = (a, b) => (a.major - b.major) || (a.minor - b.minor) || (a.patch - b.patch);
            const compare = (a, b) => compareBase(a, b) || (a.preNumber - b.preNumber);
            const stable = parsed.filter(r => !r.v.isPre).sort((a,b) => compare(b.v, a.v));
            const prereleases = parsed.filter(r => r.v.isPre).sort((a,b) => compare(b.v, a.v));
            const latestStable = stable[0]?.v || { major: 1, minor: 0, patch: 0, tag: '1.0' };
            const latestPre = prereleases[0]?.v || null;

            let tag;
            if (mode === 'beta') {
              let base;
              if (latestPre && compareBase(latestPre, latestStable) > 0) {
                base = { major: latestPre.major, minor: latestPre.minor };
              } else {
                base = { major: latestStable.major, minor: latestStable.minor + 1 };
              }
              const prefix = String(base.major) + '.' + String(base.minor) + '-dev.';
              const next = parsed
                .map(r => r.v.tag)
                .filter(t => t.startsWith(prefix))
                .map(t => Number(t.slice(prefix.length)))
                .filter(Number.isFinite)
                .reduce((max, n) => Math.max(max, n), 0) + 1;
              tag = prefix + next;
            } else {
              if (latestPre && compareBase(latestPre, latestStable) > 0) {
                tag = String(latestPre.major) + '.' + String(latestPre.minor);
              } else {
                tag = String(latestStable.major) + '.' + String(latestStable.minor + 1);
              }
            }

            if (releases.some(r => r.tag_name === tag)) {
              core.setFailed('Release tag already exists: ' + tag + '. Inspect releases before retrying.');
              return;
            }

            const title = 'v' + tag;
            const previousTag = releases[0]?.tag_name || '';
            let notes = 'Automated ' + mode + ' release for commit ' + context.sha.slice(0, 7) + '.\n\n';
            if (previousTag) {
              notes += 'Changes since ' + previousTag + '.\n\n';
              try {
                const generated = await github.rest.repos.generateReleaseNotes({
                  owner, repo, tag_name: tag, target_commitish: sourceRef, previous_tag_name: previousTag
                });
                if (generated.data.body) notes += generated.data.body;
              } catch (error) {
                notes += 'Compare changes: https://github.com/' + owner + '/' + repo + '/compare/' + previousTag + '...' + tag;
              }
            } else {
              notes += 'Automated build from the ' + sourceRef + ' branch.';
            }

            core.setOutput('mode', mode);
            core.setOutput('tag', tag);
            core.setOutput('title', title);
            core.setOutput('prerelease', mode === 'beta' ? 'true' : 'false');
            core.setOutput('notes', notes);
            core.setOutput('source_ref', sourceRef);

  build:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/build-exe.yml
    with:
      version: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
    secrets: inherit
    permissions:
      contents: read

  build-apk:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/build-apk.yml
    with:
      version: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
    secrets: inherit
    permissions:
      contents: read

  publish:
    needs: [prepare, build, build-apk]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Generate Bot Token
        id: get_bug_bot_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ steps.get_bug_bot_token.outputs.token }}
          ref: ${{ needs.prepare.outputs.source_ref }}
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: windows-exe-${{ needs.prepare.outputs.tag }}
          path: release-assets
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk-${{ needs.prepare.outputs.tag }}
          path: release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ steps.get_bug_bot_token.outputs.token }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.title }}
          body: ${{ needs.prepare.outputs.notes }}
          target_commitish: ${{ needs.prepare.outputs.source_ref }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          files: |
            release-assets/*.exe
            release-assets/*.apk
            router_app.py
          fail_on_unmatched_files: true
