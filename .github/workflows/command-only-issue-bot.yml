name: Command-Only Issue Bot

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  handle-command:
    # Ignore normal discussion and bot comments; only process exact slash commands.
    if: >-
      github.event.issue.pull_request == null ||
      github.event.issue.pull_request.url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Handle supported commands
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            const comment = context.payload.comment;
            const command = comment.body.trim().toLowerCase();
            const author = comment.user.login;
            const association = comment.author_association;

            // Do not react to bot messages or ordinary comments.
            if (comment.user.type === 'Bot' || author.endsWith('[bot]')) return;

            const supported = ['/cmd', '/lock', '/unlock', '/close', '/open', '/reopen'];
            if (!supported.includes(command)) return;

            // Only repository owners, members, and collaborators may run commands.
            const allowedRoles = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            if (!allowedRoles.includes(association)) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: '❌ **Akses ditolak.** Perintah hanya dapat dijalankan oleh owner atau kolaborator repositori.'
              });
              return;
            }

            const isPullRequest = Boolean(context.payload.issue.pull_request);
            const commentOnIssue = async (body) =>
              github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });

            if (command === '/cmd') {
              await commentOnIssue([
                '🤖 **Daftar Perintah Bot**',
                '',
                '- `/cmd` — menampilkan daftar perintah.',
                '- `/lock` — mengunci issue/PR.',
                '- `/unlock` — membuka kunci issue/PR.',
                '- `/close` — menutup issue/PR.',
                '- `/open` atau `/reopen` — membuka kembali issue/PR.',
                '',
                'Perintah harus dikirim sebagai komentar tersendiri dan hanya tersedia untuk owner/kolaborator.'
              ].join('\n'));
              return;
            }

            try {
              if (command === '/lock') {
                await github.rest.issues.lock({ owner, repo, issue_number: issueNumber, lock_reason: 'resolved' });
                await commentOnIssue('🔒 **Diskusi dikunci** melalui perintah `/lock`.');
              } else if (command === '/unlock') {
                await github.rest.issues.unlock({ owner, repo, issue_number: issueNumber });
                await commentOnIssue('🔓 **Diskusi dibuka kembali** melalui perintah `/unlock`.');
              } else if (command === '/close') {
                if (isPullRequest) {
                  await github.rest.pulls.update({ owner, repo, pull_number: issueNumber, state: 'closed' });
                } else {
                  await github.rest.issues.update({
                    owner, repo, issue_number: issueNumber, state: 'closed', state_reason: 'completed'
                  });
                }
                await commentOnIssue('🔒 **Tiket ditutup** melalui perintah `/close`.');
              } else if (command === '/open' || command === '/reopen') {
                if (isPullRequest) {
                  await github.rest.pulls.update({ owner, repo, pull_number: issueNumber, state: 'open' });
                } else {
                  await github.rest.issues.update({ owner, repo, issue_number: issueNumber, state: 'open' });
                }
                await commentOnIssue('🔓 **Tiket dibuka kembali** melalui perintah `/' + (command === '/open' ? 'open' : 'reopen') + '`.');
              }
            } catch (error) {
              core.setFailed(error.message);
              await commentOnIssue('❌ **Perintah gagal dijalankan.** Periksa status tiket dan izin GitHub Actions, lalu coba lagi.');
            }
