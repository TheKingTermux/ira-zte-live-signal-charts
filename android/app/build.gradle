plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.thekingtermux.iraztelivesignalcharts'
    compileSdk 35

    defaultConfig {
        applicationId 'com.thekingtermux.iraztelivesignalcharts'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.1-dev.6'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
